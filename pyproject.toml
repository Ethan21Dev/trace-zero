[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "trace-zero"
dynamic = ["version"]
description = "TRACE//ZERO - keyboard-driven terminal network forensics for PCAP/PCAPNG captures."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "TRACE//ZERO contributors" }]
keywords = ["pcap", "pcapng", "forensics", "network", "tui", "textual", "scapy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console :: Curses",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: System :: Networking :: Monitoring",
]
dependencies = [
    "textual>=0.86",
    "rich>=13.7",
    "scapy>=2.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "maxminddb>=2.0",  # reference reader, cross-checks the built-in MMDB reader in tests
]

[project.urls]
Homepage = "https://github.com/Ethan21Dev/trace-zero"
Documentation = "https://github.com/Ethan21Dev/trace-zero/tree/main/docs"
Issues = "https://github.com/Ethan21Dev/trace-zero/issues"

[project.scripts]
trace-zero = "trace_zero.cli:main"

[tool.setuptools.dynamic]
version = { attr = "trace_zero.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trace_zero = ["ui/*.tcss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
