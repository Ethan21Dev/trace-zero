name: Feature request
description: Suggest an improvement
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation or question you have, rather than a specific solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: How TRACE//ZERO could help. Note that it stays offline (no online lookups) and has no offensive features.
