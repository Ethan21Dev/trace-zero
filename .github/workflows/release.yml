name: Release

# Push a tag like v0.2.0 (matching trace_zero.__version__) to publish:
#   * standalone executables for Linux, Windows and macOS, plus sdist + wheel, on the GitHub release
#   * sdist + wheel to PyPI via trusted publishing (no API token stored), once PUBLISH_TO_PYPI is set
# Run it manually (workflow_dispatch) to build and smoke-test everything
# without publishing.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dist:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/trace_zero/__init__.py').read_text()).group(1))")
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - name: Build
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*

      - name: Install the wheel in a clean environment and smoke-test it
        env:
          TRACE_ZERO_HOME: ${{ runner.temp }}/tz-home
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/venv/bin/trace-zero" --version
          "$RUNNER_TEMP/venv/bin/trace-zero" --generate-sample "$RUNNER_TEMP/s.pcapng" --format pcapng
          "$RUNNER_TEMP/venv/bin/trace-zero" "$RUNNER_TEMP/s.pcapng" --headless --db "$RUNNER_TEMP/t.db" --json "$RUNNER_TEMP/r.json"

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  binaries:
    name: binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: linux-x86_64
          - os: windows-latest
            label: windows-x86_64
          - os: macos-latest
            label: macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and smoke-test the executable
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
          python scripts/build_binary.py

      - name: Name and checksum
        shell: bash
        run: |
          version=$(python -c "import trace_zero; print(trace_zero.__version__)")
          ext=""; [ "$RUNNER_OS" = "Windows" ] && ext=".exe"
          out="trace-zero-$version-${{ matrix.label }}$ext"
          mkdir -p release
          mv "dist/trace-zero$ext" "release/$out"
          cd release && python -c "import hashlib,sys; n=sys.argv[1]; print(hashlib.sha256(open(n,'rb').read()).hexdigest() + '  ' + n)" "$out" > "$out.sha256"
          cat "$out.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.label }}
          path: release/

  pypi:
    name: publish to PyPI
    # Off until the one-time setup is done: register this repository as a trusted publisher on
    # pypi.org, create a "pypi" environment, then set the repository variable PUBLISH_TO_PYPI=true.
    if: startsWith(github.ref, 'refs/tags/') && vars.PUBLISH_TO_PYPI == 'true'
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/trace-zero
    permissions:
      id-token: write  # trusted publishing; no stored credentials
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4  # for CHANGELOG.md
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          printf '\n---\nDownloads: pick the file for your system below and check it against `SHA256SUMS`.\n' >> notes.md
          cat notes.md
      - name: Create the release with binaries, packages and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir upload
          find artifacts -type f ! -name '*.sha256' -exec cp {} upload/ \;
          (cd upload && sha256sum * > SHA256SUMS)
          cat upload/SHA256SUMS
          # A release created by hand on github.com (which also creates the tag) gets the files attached.
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" upload/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            if [ "$(grep -c '[^[:space:]]' notes.md)" -gt 2 ]; then notes=(--notes-file notes.md); else notes=(--generate-notes); fi
            gh release create "$GITHUB_REF_NAME" upload/* --repo "$GITHUB_REPOSITORY" --title "TRACE//ZERO $GITHUB_REF_NAME" "${notes[@]}" --verify-tag
          fi
