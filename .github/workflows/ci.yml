name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Tests
        run: python -m pytest -q

      - name: Keyboard reference is in sync with the keymap
        run: python scripts/gen_keybindings.py --check

      - name: Headless smoke test on the synthetic sample
        shell: bash
        env:
          TRACE_ZERO_HOME: ${{ runner.temp }}/tz-home
        run: |
          trace-zero --generate-sample "$RUNNER_TEMP/sample.pcapng" --format pcapng
          trace-zero "$RUNNER_TEMP/sample.pcapng" --headless \
            --db "$RUNNER_TEMP/ci.db" \
            --json "$RUNNER_TEMP/report.json" \
            --html "$RUNNER_TEMP/report.html"
          python -c "import json,sys; d=json.load(open(sys.argv[1])); assert d['capture']['packets'] > 0 and d['heuristic_findings']['findings']" "$RUNNER_TEMP/report.json"
