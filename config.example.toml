# TRACE//ZERO configuration (optional).
#
# Copy to one of:
#   Linux / WSL : ~/.config/trace-zero/config.toml   (or $XDG_CONFIG_HOME/trace-zero/config.toml)
#   Windows     : %APPDATA%\trace-zero\config.toml
# or pass explicitly:  trace-zero --config path/to/config.toml
#
# Every key is optional; omitted keys keep their defaults (shown below).

[limits]
max_file_mb = 1024        # captures larger than this are refused before parsing
max_packets = 1000000     # import stops here and the capture is flagged TRUNCATED (~1.1 KB RAM per packet)
batch_size = 5000         # packets per progress update / cancellation check
max_raw_bytes = 65535     # cap for the raw-bytes view of one packet
max_dns_payload = 4096    # larger DNS payloads are not decoded
cache_max_mb = 2048       # on-disk cache of parsed captures; 0 disables

[anomaly]
# TZ-R1 repeated failed connection attempts
repeat_min_attempts = 6
repeat_window_s = 120.0
# TZ-R2 destination port fan-out
fanout_min_ports = 20
fanout_window_s = 60.0
# TZ-R3 traffic volume spike (robust z-score over per-bin bytes)
spike_bin_s = 1.0
spike_min_bins = 10
spike_z = 6.0
spike_min_factor = 4.0
spike_min_bytes = 20000
# TZ-R4 DNS query spike (per source)
dns_bin_s = 10.0
dns_min_queries = 20
dns_min_factor = 4.0
# TZ-R5 frequent host-pair communication
pair_min_pairs = 5
pair_min_contacts = 20
pair_z = 5.0
pair_periodic_z = 2.0
pair_periodic_cv = 0.25
# TZ-R6 (ARP: one IPv4 address, several MACs) and TZ-R10 (SNI vs DNS answers) have no thresholds.
# TZ-R7 DNS responses without a matching query
dns_unsolicited_min = 1
dns_startup_grace_s = 1.0   # unmatched responses this early may answer a query sent before the capture
# TZ-R8 heavy outbound transfer (internal -> external)
outbound_min_bytes = 500000
outbound_ratio = 5.0
# TZ-R9 new external destinations late in the capture
late_fraction = 0.5         # "late" = after this share of the capture ...
late_min_baseline_s = 60.0  # ... and after at least this many seconds
late_min_bytes = 5000
# supporting frame references stored per finding
max_refs = 500

[paths]
# db = "~/.local/share/trace-zero/investigations.db"
# exports = "~/trace-zero-exports"
# cache = "~/.local/share/trace-zero/cache"
# Optional offline reference data (never downloaded by TRACE//ZERO itself):
# oui = "~/.local/share/trace-zero/oui.csv"          # python scripts/fetch_oui.py
# geoip = ["~/GeoLite2-City.mmdb", "~/GeoLite2-ASN.mmdb"]
# Live mode (F): capture tool used to record from an interface. Default: dumpcap, else tcpdump,
# found on PATH (and in Program Files\Wireshark on Windows).
# capture_tool = "/usr/bin/dumpcap"
